<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Root</title>
<style>
:root{--bg:#140F12;--s1:#211A1E;--s2:#2B2327;--tx:#EBDFE3;--mu:#B3A2A9;--ac:#F4B6CC;--on:#4A1B2E;--ico:#4A2C38;--ok:#9BD6A0;--dg:#FFB4AB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px}
.ic{width:88px;height:88px;border-radius:28px;background:var(--ico);display:flex;align-items:center;justify-content:center;margin-bottom:26px;transition:background .3s}
.ic svg{width:40px;height:40px;stroke:var(--ac);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.ic .ck,.ic .xx{display:none}
body.ok .lock,body.no .lock,body.nm .lock{display:none}
body.ok .ck{display:block;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .4s .05s forwards}
body.no .xx,body.nm .xx{display:block}
body.ok .ic{background:#24402b}body.ok .ic svg{stroke:var(--ok)}
body.no .ic,body.nm .ic{background:#4a2326}body.no .ic svg,body.nm .ic svg{stroke:var(--dg)}
@keyframes dr{to{stroke-dashoffset:0}}
h1{margin:0 0 8px;font-size:26px;font-weight:700;text-align:center;letter-spacing:-.2px}
h1 b{color:var(--ac);font-weight:700}
p{margin:0;text-align:center;color:var(--mu);font-size:14.5px;line-height:1.5;max-width:320px;min-height:66px}
.steps{margin:18px 0 0;width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px}
.st{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:18px;background:var(--s1);font-size:15px;color:var(--mu);transition:color .25s,background .25s}
.st i{flex:none;width:24px;height:24px;border-radius:50%;border:2.5px solid #4a3d43;position:relative}
.st.run{color:var(--tx);background:var(--s2)}.st.run i{border-color:var(--ac);border-top-color:transparent;animation:sp .8s linear infinite}
.st.done{color:var(--tx)}.st.done i{background:var(--ok);border-color:var(--ok)}
.st.done i::after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;border:solid #0f2b14;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.st.bad{color:var(--dg)}.st.bad i{background:var(--dg);border-color:var(--dg)}
.st.bad i::after{content:"!";position:absolute;inset:0;text-align:center;font:800 13px/19px sans-serif;color:#410002}
@keyframes sp{to{transform:rotate(360deg)}}
.btn{display:none;margin-top:18px;width:100%;max-width:340px;height:54px;border:0;border-radius:27px;background:var(--ac);color:var(--on);font:700 16px system-ui}
.btn:active{transform:scale(.98)}
body.no .btn,body.nm .btn{display:block}
</style></head><body class="">
<div class="ic"><svg viewBox="0 0 24 24"><g class="lock"><rect x="4.5" y="10.5" width="15" height="9.5" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></g><path class="ck" d="M6 12.5l4 4 8-9"/><g class="xx"><path d="M7 7l10 10M17 7L7 17"/></g></svg></div>
<h1 id="t">Akses <b>Root</b></h1>
<p id="d">Comatoze butuh izin Superuser untuk mengatur kernel, CPU &amp; GPU. Pilih <b>Izinkan</b> pada dialog yang muncul.</p>
<div class="steps">
<div class="st run" id="s1"><i></i>Meminta izin Superuser</div>
<div class="st" id="s2"><i></i>Memeriksa modul Comatoze</div>
<div class="st" id="s3"><i></i>Membuka manager</div></div>
<button class="btn" id="b" onclick="Gate.retry()">Coba lagi</button>
<script>
function $(i){return document.getElementById(i)}
function st(i,c){$('s'+i).className='st '+c}
function setState(x){var b=document.body;b.className=x==='ok'?'ok':x==='denied'?'no':x==='nomod'?'nm':'';
 if(x==='wait'){st(1,'run');st(2,'');st(3,'');$('t').innerHTML='Akses <b>Root</b>';$('d').innerHTML='Comatoze butuh izin Superuser untuk mengatur kernel, CPU &amp; GPU. Pilih <b>Izinkan</b> pada dialog yang muncul.';}
 if(x==='mod'){st(1,'done');st(2,'run');st(3,'');$('t').innerHTML='Root <b>diberikan</b>';$('d').innerHTML='Memeriksa modul Comatoze…';}
 if(x==='ok'){st(1,'done');st(2,'done');st(3,'run');$('t').innerHTML='Siap <b>masuk</b>';$('d').innerHTML='Semua akses lengkap. Membuka manager…';}
 if(x==='denied'){st(1,'bad');st(2,'');st(3,'');$('t').innerHTML='Root <b style="color:var(--dg)">ditolak</b>';$('d').innerHTML='Berikan izin Superuser ke Comatoze di KernelSU / Magisk, lalu tekan Coba lagi.';}
 if(x==='nomod'){st(1,'done');st(2,'bad');st(3,'');$('t').innerHTML='Modul <b style="color:var(--dg)">belum aktif</b>';$('d').innerHTML='Flash modul Comatoze lalu reboot, kemudian tekan Coba lagi.';}}
</script></body></html>
